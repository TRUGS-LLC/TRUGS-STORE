[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trugs-store"
version = "2.1.0"
description = "Graph storage backends for TRUGS specifications — InMemory, PostgreSQL, JSON file persistence. Native TRUGS 2.0 (core_v2.0.0) support: LEVEL_PREFIX hierarchy validation, inheritance stamping, canonical re-emit."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []
authors = [
    {name = "TRUGS LLC"},
]
keywords = ["trugs", "graph", "storage", "json", "postgresql", "persistence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/TRUGS-LLC/TRUGS-STORE"
Repository = "https://github.com/TRUGS-LLC/TRUGS-STORE"
Issues = "https://github.com/TRUGS-LLC/TRUGS-STORE/issues"
Specification = "https://github.com/TRUGS-LLC/TRUGS"
Documentation = "https://github.com/TRUGS-LLC/TRUGS/blob/main/GETTING_STARTED.md"
Changelog = "https://github.com/TRUGS-LLC/TRUGS-STORE/blob/main/CHANGELOG.md"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=7.0",
    "coverage>=7.0",
    "pyyaml>=6.0",  # test_ci_meta.py parses ci.yml when a workflow is supplied
]

[tool.hatch.build.targets.wheel]
packages = ["src/trugs_store"]
